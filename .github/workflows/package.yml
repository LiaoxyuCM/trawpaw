name: Trawpaw Packagements

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile repl.py -n trawpaw --hidden-import=prompt_toolkit --hidden-import=colorama

      - name: Upload Executable
        uses: actions/upload-artifact@v6
        with:
          name: trawpaw-${{ matrix.os }}
          path: dist/
